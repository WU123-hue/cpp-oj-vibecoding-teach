<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OJ System — 注册</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2322C55E'/><text x='50' y='68' font-size='56' font-weight='bold' text-anchor='middle' fill='%23020617' font-family='monospace'>&lt;/&gt;</text></svg>">
</head>
<body>

  <!-- 背景效果 -->
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow--green"></div>
  <div class="bg-glow bg-glow--blue"></div>

  <div class="auth-container">
    <div class="auth-card">

      <!-- 品牌标识 -->
      <div class="brand">
        <div class="brand__icon">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 20l-5-5 5-5M14 4l5 5-5 5" />
          </svg>
        </div>
        <div class="brand__name">OJ</div>
      </div>

      <h1 class="auth-title">创建账号</h1>
      <p class="auth-subtitle">注册一个新账号开始编程之旅</p>

      <!-- 错误/成功提示 -->
      <div id="alert" class="alert" role="alert"></div>

      <!-- 注册表单 -->
      <form id="registerForm" autocomplete="off">

        <div class="form-group">
          <label class="form-label" for="username">用户名</label>
          <div class="input-wrapper">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            <input type="text" id="username" name="username" class="form-input"
                   placeholder="3-64个字符" required minlength="3" maxlength="64"
                   autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">密码</label>
          <div class="input-wrapper">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            <input type="password" id="password" name="password" class="form-input"
                   placeholder="至少6位" required
                   autocomplete="new-password">
          </div>
          <!-- 密码强度指示器 -->
          <div class="pwd-strength">
            <div class="strength-bar">
              <div id="strengthBar" class="strength-bar__fill"></div>
            </div>
            <div id="strengthLabel" class="strength-label"></div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">确认密码</label>
          <div class="input-wrapper">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-input"
                   placeholder="再次输入密码" required
                   autocomplete="new-password">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn--primary">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
          </svg>
          注册
        </button>

      </form>

      <!-- 底部链接 -->
      <p class="auth-footer">
        已有账号？<a href="/login.html">直接登录</a>
      </p>

    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    (function() {
      const form = document.getElementById('registerForm');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const confirmInput = document.getElementById('confirmPassword');

      // 密码强度实时更新
      passwordInput.addEventListener('input', function() {
        Auth.updateStrengthUI('strengthBar', 'strengthLabel', passwordInput.value);
      });

      form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        const confirm = confirmInput.value;

        // 前端校验
        if (!username) {
          Auth.showAlert('alert', '请输入用户名', 'error');
          usernameInput.focus();
          return;
        }
        if (username.length < 3 || username.length > 64) {
          Auth.showAlert('alert', '用户名长度需3-64个字符', 'error');
          usernameInput.focus();
          return;
        }
        if (!password) {
          Auth.showAlert('alert', '请输入密码', 'error');
          passwordInput.focus();
          return;
        }
        if (password.length < 6 || password.length > 64) {
          Auth.showAlert('alert', '密码长度需6-64个字符', 'error');
          passwordInput.focus();
          return;
        }
        if (password !== confirm) {
          Auth.showAlert('alert', '两次输入的密码不一致', 'error');
          confirmInput.focus();
          return;
        }

        Auth.hideAlert('alert');
        Auth.setLoading('submitBtn', true, '注册中...');

        try {
          const resp = await API.register(username, password);

          if (resp.ok && resp.data.code === 200) {
            Auth.showAlert('alert', '注册成功，正在跳转到登录页...', 'success');
            setTimeout(function() {
              window.location.href = '/login.html';
            }, 1200);
          } else {
            Auth.showAlert('alert', resp.data.message || '注册失败', 'error');
          }
        } catch (err) {
          Auth.showAlert('alert', '网络错误，请重试', 'error');
        } finally {
          Auth.setLoading('submitBtn', false);
        }
      });
    })();
  </script>

</body>
</html>
