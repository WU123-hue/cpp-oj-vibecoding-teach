<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OJ System — 登录</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2322C55E'/><text x='50' y='68' font-size='56' font-weight='bold' text-anchor='middle' fill='%23020617' font-family='monospace'>&lt;/&gt;</text></svg>">
</head>
<body>

  <!-- 背景效果 -->
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow--green"></div>
  <div class="bg-glow bg-glow--blue"></div>

  <div class="auth-container">
    <div class="auth-card">

      <!-- 品牌标识 -->
      <div class="brand">
        <div class="brand__icon">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 20l-5-5 5-5M14 4l5 5-5 5" />
          </svg>
        </div>
        <div class="brand__name">OJ</div>
      </div>

      <h1 class="auth-title">欢迎回来</h1>
      <p class="auth-subtitle">登录你的账号开始刷题</p>

      <!-- 错误/成功提示 -->
      <div id="alert" class="alert" role="alert"></div>

      <!-- 登录表单 -->
      <form id="loginForm" autocomplete="off">

        <div class="form-group">
          <label class="form-label" for="username">用户名</label>
          <div class="input-wrapper">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            <input type="text" id="username" name="username" class="form-input"
                   placeholder="输入用户名" required minlength="3" maxlength="64"
                   autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">密码</label>
          <div class="input-wrapper">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            <input type="password" id="password" name="password" class="form-input"
                   placeholder="输入密码" required
                   autocomplete="current-password">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn--primary">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
          </svg>
          登录
        </button>

      </form>

      <!-- 底部链接 -->
      <p class="auth-footer">
        还没有账号？<a href="/register.html">立即注册</a>
      </p>

    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    (function() {
      const form = document.getElementById('loginForm');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');

      form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        // 基本校验
        if (!username) {
          Auth.showAlert('alert', '请输入用户名', 'error');
          usernameInput.focus();
          return;
        }
        if (!password) {
          Auth.showAlert('alert', '请输入密码', 'error');
          passwordInput.focus();
          return;
        }

        Auth.hideAlert('alert');
        Auth.setLoading('submitBtn', true, '登录中...');

        try {
          const resp = await API.login(username, password);

          if (resp.ok && resp.data.code === 200) {
            // 保存用户信息到 localStorage
            localStorage.setItem('oj_user', JSON.stringify({
              id: resp.data.data.id,
              username: resp.data.data.username,
              role: resp.data.data.role
            }));
            Auth.showAlert('alert', '登录成功，正在跳转...', 'success');
            setTimeout(function() {
              window.location.href = '/problem_list.html';
            }, 800);
          } else {
            Auth.showAlert('alert', resp.data.message || '登录失败', 'error');
          }
        } catch (err) {
          Auth.showAlert('alert', '网络错误，请重试', 'error');
        } finally {
          Auth.setLoading('submitBtn', false);
        }
      });
    })();
  </script>

</body>
</html>
